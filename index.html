<script>
let audioCtx = null;

function initAudio() {
if (!audioCtx) {
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
if (audioCtx.state === 'suspended') {
audioCtx.resume();
}
}

function playCodeTypingSound() {
try {
initAudio();
if (!audioCtx) return;
let osc = audioCtx.createOscillator();
let gain = audioCtx.createGain();
osc.connect(gain);
gain.connect(audioCtx.destination);
let now = audioCtx.currentTime;

osc.type = 'triangle';
let freq = 800 + Math.random() * 1200;
osc.frequency.setValueAtTime(freq, now);
osc.frequency.exponentialRampToValueAtTime(freq + 300, now + 0.05);

gain.gain.setValueAtTime(0.08, now);
gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

osc.start(now);
osc.stop(now + 0.05);
} catch(e) {}
}

function playSound(type) {
try {
initAudio();
if (!audioCtx) return;
let osc = audioCtx.createOscillator();
let gain = audioCtx.createGain();
osc.connect(gain);
gain.connect(audioCtx.destination);
let now = audioCtx.currentTime;

if (type === 'click') {
osc.type = 'sine';
osc.frequency.setValueAtTime(600, now);
osc.frequency.exponentialRampToValueAtTime(900, now + 0.12);
gain.gain.setValueAtTime(0.3, now);
gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
osc.start(now);
osc.stop(now + 0.12);
} else if (type === 'beep') {
osc.type = 'sine';
osc.frequency.setValueAtTime(440, now);
osc.frequency.exponentialRampToValueAtTime(880, now + 0.2);
gain.gain.setValueAtTime(0.4, now);
gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
osc.start(now);
osc.stop(now + 0.2);
} else if (type === 'blow') {
let bufferSize = audioCtx.sampleRate * 1.8;
let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
let data = buffer.getChannelData(0);
for (let i = 0; i < bufferSize; i++) {
data[i] = Math.random() * 2 - 1;
}
let noise = audioCtx.createBufferSource();
noise.buffer = buffer;
let filter = audioCtx.createBiquadFilter();
filter.type = 'bandpass';
filter.frequency.value = 400;
noise.connect(filter);
filter.connect(gain);
gain.gain.setValueAtTime(0.01, now);
gain.gain.linearRampToValueAtTime(0.4, now + 0.3);
gain.gain.exponentialRampToValueAtTime(0.01, now + 1.8);
noise.start(now);
} else if (type === 'fireworks-frenzy') {
// မီးရှုးပန်းအရေအတွက် လျှော့ချထားပြီး ၁.၅ စက္ကန့်အတွင်း မြန်မြန်ဖောက်ကာ မြန်မြန်ပြန်ရုတ်သိမ်းရန် တိုတောင်းသောကြာချိန် (1.5 seconds) ဖြင့် ပြင်ဆင်ထားသည်
let bufferSize = audioCtx.sampleRate * 1.5;
let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
let data = buffer.getChannelData(0);
for (let i = 0; i < bufferSize; i++) {
let val = Math.random() * 2 - 1;
if (Math.random() < 0.05) { val *= 3; }
data[i] = val;
}
let noise = audioCtx.createBufferSource();
noise.buffer = buffer;
let filter = audioCtx.createBiquadFilter();
filter.type = 'lowpass';
filter.frequency.setValueAtTime(800, now);
filter.frequency.linearRampToValueAtTime(300, now + 1.5);
noise.connect(filter);
filter.connect(gain);
gain.gain.setValueAtTime(0.5, now);
gain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
noise.start(now);
} else if (type === 'balloon') {
osc.type = 'sine';
osc.frequency.setValueAtTime(200, now);
osc.frequency.exponentialRampToValueAtTime(600, now + 0.25);
gain.gain.setValueAtTime(0.3, now);
gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
osc.start(now);
osc.stop(now + 0.25);
}
} catch(e) {}
}

function speakText(text, callback) {
if ('speechSynthesis' in window) {
window.speechSynthesis.cancel();
let utterance = new SpeechSynthesisUtterance(text);
utterance.rate = 1.0;
utterance.pitch = 1.2;
utterance.onend = () => { if (callback) callback(); };
window.speechSynthesis.speak(utterance);
} else {
if (callback) callback();
}
}

const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let currentMode = 'matrix';
const characters = "LOVE♥HBD1234567890HAPPYBIRTHDAY";
const fontSize = 16;
const columns = canvas.width / fontSize;
const drops = [];
for (let i = 0; i < columns; i++) { drops[i] = 1; }
let matrixCounter = 0;

const spaceStars = [];
for (let i = 0; i < 300; i++) {
spaceStars.push({
x: Math.random() * canvas.width,
y: Math.random() * canvas.height,
radius: Math.random() * 1.5,
alpha: Math.random()
});
}

const orbits = [
{ rx: 90, ry: 45, speed: 0.006, angle: Math.random() * Math.PI, size: 4, color: '#ff80bf' },
{ rx: 140, ry: 70, speed: 0.0048, angle: Math.random() * Math.PI, size: 6, color: '#ffb3c6' },
{ rx: 200, ry: 100, speed: 0.0038, angle: Math.random() * Math.PI, size: 7, color: '#4da6ff' },
{ rx: 270, ry: 135, speed: 0.003, angle: Math.random() * Math.PI, size: 9, color: '#ff6648' },
{ rx: 350, ry: 175, speed: 0.0022, angle: Math.random() * Math.PI, size: 12, color: '#ffd11a' },
{ rx: 440, ry: 220, speed: 0.0015, angle: Math.random() * Math.PI, size: 14, color: '#bf80ff', hasRing: true },
{ rx: 530, ry: 265, speed: 0.001, angle: Math.random() * Math.PI, size: 10, color: '#33ccff' }
];

let fireworks = [];
let balloons = [];
let heavyFireworksActive = false;

class Firework3D {
constructor(isHeavy = false) {
this.x = Math.random() * (canvas.width * 0.8) + (canvas.width * 0.1);
this.y = canvas.height + 10;
this.targetY = Math.random() * (canvas.height * 0.5) + (canvas.height * 0.05);
this.speed = isHeavy ? (Math.random() * 2.5 + 2.0) : (Math.random() * 1.2 + 1.2);
this.particles = [];
this.exploded = false;
this.isHeavy = isHeavy;
const colorPalettes = ['#ff3385', '#ff4d94', '#ff80b3', '#ff1a75', '#ff99bb', '#ffffff', '#ffb3d1', '#ffff66', '#33ccff'];
this.color = colorPalettes[Math.floor(Math.random() * colorPalettes.length)];
}
update() {
if (!this.exploded) {
this.y -= this.speed;
if (this.y <= this.targetY) {
this.exploded = true;
// မီးရှုးပန်း အရေအတွက်ကို သိသိသာသာ လျှော့ချထားသည် (Heavy: 35, Normal: 20)
let count = this.isHeavy ? 35 : 20;
for (let i = 0; i < count; i++) {
const theta = Math.random() * Math.PI * 2;
const phi = Math.acos((Math.random() * 2) - 1);
const speed = this.isHeavy ? (Math.random() * 4.0 + 1.0) : (Math.random() * 2.2 + 0.6);
this.particles.push({
x: this.x, y: this.y,
vx: Math.sin(phi) * Math.cos(theta) * speed,
vy: Math.sin(phi) * Math.sin(theta) * speed,
vz: Math.cos(phi) * speed,
alpha: 1,
// မြန်မြန်ပျောက်ကွယ်ရန် decay တန်ဖိုးကို မြှင့်တင်ထားသည် (လျင်မြန်စွာ ရုတ်သိမ်းရန်)
decay: this.isHeavy ? (Math.random() * 0.04 + 0.02) : (Math.random() * 0.05 + 0.03),
color: Math.random() > 0.2 ? this.color : '#ffffff'
});
}
}
} else {
this.particles.forEach(p => {
p.x += p.vx; p.y += p.vy; p.vy += 0.025; p.alpha -= p.decay;
});
this.particles = this.particles.filter(p => p.alpha > 0);
}
}
draw() {
if (!this.exploded) {
ctx.save(); ctx.fillStyle = this.color; ctx.shadowBlur = 12; ctx.shadowColor = this.color;
ctx.beginPath(); ctx.arc(this.x, this.y, this.isHeavy ? 3.5 : 2, 0, Math.PI * 2); ctx.fill(); ctx.restore();
} else {
this.particles.forEach(p => {
let scale3d = (p.vz + 4) / 4; if (scale3d < 0.2) scale3d = 0.2;
ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color; ctx.shadowBlur = 12; ctx.shadowColor = p.color;
ctx.beginPath(); ctx.arc(p.x, p.y, (this.isHeavy ? 3.0 : 2.2) * scale3d, 0, Math.PI * 2); ctx.fill(); ctx.restore();
});
}
}
}

class Balloon {
constructor() {
this.x = Math.random() * canvas.width;
this.y = canvas.height + 30;
this.speed = Math.random() * 1.5 + 1;
this.size = Math.random() * 15 + 20;
this.symbol = ['🎈', '💖', '🎁', '⭐', '🎂'][Math.floor(Math.random() * 5)];
this.amplitude = Math.random() * 20 + 10;
this.frequency = Math.random() * 0.02 + 0.01;
this.angle = Math.random() * Math.PI * 2;
}
update() {
this.y -= this.speed;
this.angle += this.frequency;
this.currentX = this.x + Math.sin(this.angle) * this.amplitude;
}
draw() {
ctx.save();
ctx.font = this.size + 'px sans-serif';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.shadowBlur = 10;
ctx.shadowColor = '#ff4d88';
ctx.fillText(this.symbol, this.currentX, this.y);
ctx.restore();
}
}

let companionAngle = 0;

function drawCompanionCharacters() {
companionAngle += 0.005;
const centerX = canvas.width / 2;
const centerY = canvas.height / 2;
const orbitRx = 380;
const orbitRy = 190;

const bx = centerX + Math.cos(companionAngle) * orbitRx;
const by = centerY + Math.sin(companionAngle) * orbitRy;

const dx = centerX + Math.cos(companionAngle + 0.15) * orbitRx;
const dy = centerY + Math.sin(companionAngle + 0.15) * orbitRy;

drawSingleEmoji(bx, by, "🐼", "BUBU");
drawSingleEmoji(dx, dy, "🐻", "DUDU");
}

function drawSingleEmoji(x, y, emoji, name) {
ctx.save();
ctx.translate(x, y);
ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
ctx.beginPath(); ctx.ellipse(0, 25, 20, 8, 0, 0, Math.PI * 2); ctx.fill();
ctx.font = '45px sans-serif';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.shadowBlur = 0;
ctx.fillText(emoji, 0, 0);
ctx.fillStyle = '#ffffff';
ctx.font = 'bold 12px Courier New';
ctx.fillText(name, 0, -32);
ctx.restore();
}

function animateBackground() {
if (currentMode === 'matrix') {
matrixCounter++;
if (matrixCounter % 2 === 0) {
ctx.fillStyle = 'rgba(2, 0, 5, 0.15)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
ctx.fillStyle = '#ff4d88'; ctx.font = fontSize + 'px monospace';
for (let i = 0; i < drops.length; i++) {
const text = characters.charAt(Math.floor(Math.random() * characters.length));
ctx.fillText(text, i * fontSize, drops[i] * fontSize);
if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) { drops[i] = 0; }
drops[i]++;
}
if (Math.random() < 0.3) {
playCodeTypingSound();
}
}
} else if (currentMode === 'galaxy' || currentMode === 'balloons') {
ctx.fillStyle = 'rgba(2, 0, 5, 0.22)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
const centerX = canvas.width / 2; const centerY = canvas.height / 2;

spaceStars.forEach(star => {
star.alpha += (Math.random() - 0.5) * 0.06;
if (star.alpha < 0.1) star.alpha = 0.1; if (star.alpha > 1) star.alpha = 1;
ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
ctx.beginPath(); ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2); ctx.fill();
});

let fwRate = heavyFireworksActive ? 0.35 : 0.025;
if (Math.random() < fwRate) { fireworks.push(new Firework3D(heavyFireworksActive)); }
if (heavyFireworksActive && Math.random() < 0.25) { fireworks.push(new Firework3D(true)); }

fireworks.forEach((fw, index) => {
fw.update(); fw.draw();
if (fw.exploded && fw.particles.length === 0) { fireworks.splice(index, 1); }
});

if (currentMode === 'balloons') {
if (Math.random() < 0.05) { balloons.push(new Balloon()); }
balloons.forEach((b, index) => {
b.update(); b.draw();
if (b.y < -50) balloons.splice(index, 1);
});
}

const sunGlow = ctx.createRadialGradient(centerX, centerY, 5, centerX, centerY, 60);
sunGlow.addColorStop(0, '#ffffff'); sunGlow.addColorStop(0.3, '#ffcc00');
sunGlow.addColorStop(0.7, '#ff3300'); sunGlow.addColorStop(1, 'transparent');
ctx.fillStyle = sunGlow; ctx.beginPath(); ctx.arc(centerX, centerY, 50, 0, Math.PI * 2); ctx.fill();

orbits.forEach(orbit => {
ctx.strokeStyle = 'rgba(255, 179, 198, 0.15)'; ctx.lineWidth = 1;
ctx.beginPath(); ctx.ellipse(centerX, centerY, orbit.rx, orbit.ry, 0, 0, Math.PI * 2); ctx.stroke();
orbit.angle += orbit.speed;
const px = centerX + Math.cos(orbit.angle) * orbit.rx;
const py = centerY + Math.sin(orbit.angle) * orbit.ry;
ctx.shadowBlur = 10; ctx.shadowColor = orbit.color; ctx.fillStyle = orbit.color;
ctx.beginPath(); ctx.arc(px, py, orbit.size, 0, Math.PI * 2); ctx.fill();
if (orbit.hasRing) {
ctx.strokeStyle = 'rgba(191, 128, 255, 0.7)'; ctx.lineWidth = 2;
ctx.beginPath(); ctx.ellipse(px, py, orbit.size * 2.2, orbit.size * 0.8, Math.PI / 4, 0, Math.PI * 2); ctx.stroke();
}
ctx.shadowBlur = 0;
});

drawCompanionCharacters();
}
requestAnimationFrame(animateBackground);
}

animateBackground();

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
