<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Solar System & Realistic 3D Fireworks Birthday Surprise</title>
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Courier New', Courier, monospace;
}

body {
background-color: #020005;
color: #ff99bb;
overflow-x: hidden;
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
}

canvas {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
z-index: 1;
pointer-events: none;
}

.container {
position: relative;
z-index: 10;
text-align: center;
width: 100%;
max-width: 480px;
padding: 15px;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
}

.screen {
position: absolute;
display: none;
flex-direction: column;
align-items: center;
justify-content: center;
animation: fadeIn 0.5s ease-in-out;
width: 100%;
padding: 10px;
}

.screen.active {
display: flex;
}

@keyframes fadeIn {
from { opacity: 0; transform: scale(0.95); }
to { opacity: 1; transform: scale(1); }
}

h1 {
font-size: clamp(2.5rem, 8vw, 4rem);
color: #ffb3c6;
text-shadow: 0 0 15px #ff4d88, 0 0 30px #ff1a75;
letter-spacing: 2px;
padding: 0 10px;
text-align: center;
}

.start-btn {
background: rgba(255, 77, 136, 0.15);
backdrop-filter: blur(8px);
border: 2px solid #ff4d88;
color: #ffb3c6;
padding: 15px 35px;
font-size: 1.5rem;
cursor: pointer;
text-shadow: 0 0 10px #ff4d88;
box-shadow: 0 0 20px rgba(255, 77, 136, 0.4);
border-radius: 50px;
transition: 0.3s;
font-weight: bold;
letter-spacing: 1px;
}

.start-btn:hover {
background: #ff4d88;
color: #fff;
box-shadow: 0 0 30px #ff4d88, 0 0 60px #ff4d88;
transform: scale(1.05);
}

.bouquet-card {
background: transparent;
backdrop-filter: none;
-webkit-backdrop-filter: none;
border: 2px solid rgba(255, 77, 136, 0.9);
padding: 15px;
border-radius: 20px;
box-shadow: 0 0 35px rgba(255, 77, 136, 0.5), inset 0 0 15px rgba(255, 77, 136, 0.2);
width: 100%;
max-width: 440px;
display: flex;
flex-direction: column;
align-items: center;
}

.bouquet-title {
font-size: 1.1rem;
color: #ffb3c6;
text-shadow: 0 0 8px #ff4d88;
margin-bottom: 10px;
letter-spacing: 1px;
}

.bouquet-area {
position: relative;
width: 100%;
height: 200px;
margin-bottom: 10px;
display: flex;
justify-content: center;
align-items: center;
}

.photo-item {
position: absolute;
width: 65px;
height: 65px;
border: 2px solid #ffb3c6;
border-radius: 8px;
background: rgba(255, 255, 255, 0.15);
backdrop-filter: blur(4px);
overflow: hidden;
box-shadow: 0 0 12px #ff4d88;
display: flex;
justify-content: center;
align-items: center;
opacity: 0;
transform: scale(0);
transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
cursor: pointer;
}

.photo-item.show {
opacity: 1;
}

.p1.show { transform: translate(-110px, -60px) rotate(-15deg) scale(1); }
.p2.show { transform: translate(-55px, -95px) rotate(-8deg) scale(1); }
.p3.show { transform: translate(0px, -110px) rotate(0deg) scale(1); }
.p4.show { transform: translate(55px, -95px) rotate(8deg) scale(1); }
.p5.show { transform: translate(110px, -60px) rotate(15deg) scale(1); }

.photo-item img {
width: 100%;
height: 100%;
object-fit: cover;
}

.bouquet-base {
position: absolute;
bottom: 5px;
font-size: 40px;
text-shadow: 0 0 15px #ff1a75;
z-index: 2;
}

.wish-box {
font-size: 0.9rem;
line-height: 1.4;
color: #fff;
text-shadow: 0 0 6px #ff4d88;
background: rgba(25, 5, 15, 0.55);
backdrop-filter: blur(10px);
-webkit-backdrop-filter: blur(10px);
border: 1px dashed rgba(255, 77, 136, 0.9);
padding: 10px 12px;
border-radius: 10px;
width: 100%;
min-height: 65px;
display: flex;
align-items: center;
justify-content: center;
text-align: center;
box-shadow: 0 0 15px rgba(255, 77, 136, 0.2);
}

#lightbox {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(2, 0, 5, 0.9);
backdrop-filter: blur(10px);
display: none;
justify-content: center;
align-items: center;
z-index: 1000;
flex-direction: column;
cursor: pointer;
padding: 20px;
}

.lightbox-card {
background: rgba(25, 5, 15, 0.85);
backdrop-filter: blur(15px);
border: 3px solid #ff4d88;
padding: 20px;
border-radius: 15px;
box-shadow: 0 0 40px #ff4d88;
max-width: 400px;
width: 100%;
text-align: center;
}

.lightbox-card img {
width: 100%;
max-height: 55vh;
border: 2px solid #ffb3c6;
border-radius: 8px;
object-fit: contain;
margin-bottom: 12px;
box-shadow: 0 0 15px #ff4d88;
}

.lightbox-wish {
font-size: 0.95rem;
color: #fff;
text-shadow: 0 0 5px #ff4d88;
line-height: 1.4;
}

.lightbox-close {
color: #ffb3c6;
margin-top: 15px;
font-size: 0.9rem;
text-shadow: 0 0 8px #ff4d88;
}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div id="lightbox" onclick="closeLightbox()">
<div class="lightbox-card" onclick="event.stopPropagation()">
<img id="lightbox-img" src="" alt="Full View">
<div id="lightbox-wish" class="lightbox-wish"></div>
<div class="lightbox-close" onclick="closeLightbox()">[ Click here to close ]</div>
</div>
</div>

<div class="container">
<div id="screen-start" class="screen active">
<button class="start-btn" onclick="startIntro()">CLICK TO START ♥</button>
</div>

<div id="screen-3" class="screen"><h1>3</h1></div>
<div id="screen-2" class="screen"><h1>2</h1></div>
<div id="screen-1" class="screen"><h1>1</h1></div>

<div id="screen-happy" class="screen"><h1>HAPPY</h1></div>
<div id="screen-bday" class="screen"><h1>BIRTHDAY</h1></div>
<div id="screen-toyou" class="screen"><h1>TO YOU</h1></div>

<div id="screen-bouquet" class="screen">
<div class="bouquet-card">
<div class="bouquet-title">SPECIAL MEMORIES FOR YOU</div>

<div class="bouquet-area">
<div class="photo-item p1" onclick="openLightbox(0)">
<img src="https://i.ibb.co/DSXNdck/IMG-7208.png" alt="Memory 1">
</div>
<div class="photo-item p2" onclick="openLightbox(1)">
<img src="https://i.ibb.co/Zzf9xfX1/IMG-7156.jpg" alt="Memory 2">
</div>
<div class="photo-item p3" onclick="openLightbox(2)">
<img src="https://i.ibb.co/V0tgjspR/IMG-7207.png" alt="Memory 3">
</div>
<div class="photo-item p4" onclick="openLightbox(3)">
<img src="https://i.ibb.co/LD3NkqDB/IMG-6902.jpg" alt="Memory 4">
</div>
<div class="photo-item p5" onclick="openLightbox(4)">
<img src="https://i.ibb.co/cz1ZjDr/IMG-6973.jpg" alt="Memory 5">
</div>

<div class="bouquet-base">💐</div>
</div>

<div id="main-wish-box" class="wish-box">
"Tap on each blooming flower photo to reveal special moments & wishes! ✨🎂"
</div>
</div>
</div>
</div>

<script>
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let currentMode = 'matrix';

// Matrix variables
const characters = "LOVE♥HBD1234567890HAPPYBIRTHDAY";
const fontSize = 16;
const columns = canvas.width / fontSize;
const drops = [];
for (let i = 0; i < columns; i++) { drops[i] = 1; }
let matrixCounter = 0;

// Background Space Stars
const spaceStars = [];
for (let i = 0; i < 300; i++) {
spaceStars.push({
x: Math.random() * canvas.width,
y: Math.random() * canvas.height,
radius: Math.random() * 1.5,
alpha: Math.random()
});
}

// Solar System Orbits & Planets
const orbits = [
{ rx: 90, ry: 45, speed: 0.006, angle: Math.random() * Math.PI, size: 4, color: '#ff80bf' },
{ rx: 140, ry: 70, speed: 0.0048, angle: Math.random() * Math.PI, size: 6, color: '#ffb3c6' },
{ rx: 200, ry: 100, speed: 0.0038, angle: Math.random() * Math.PI, size: 7, color: '#4da6ff' },
{ rx: 270, ry: 135, speed: 0.003, angle: Math.random() * Math.PI, size: 9, color: '#ff6648' },
{ rx: 350, ry: 175, speed: 0.0022, angle: Math.random() * Math.PI, size: 12, color: '#ffd11a' },
{ rx: 440, ry: 220, speed: 0.0015, angle: Math.random() * Math.PI, size: 14, color: '#bf80ff', hasRing: true },
{ rx: 530, ry: 265, speed: 0.001, angle: Math.random() * Math.PI, size: 10, color: '#33ccff' }
];

// Realistic 3D Fireworks
let fireworks = [];

class Firework3D {
constructor() {
this.x = Math.random() * (canvas.width * 0.8) + (canvas.width * 0.1);
this.y = canvas.height + 10;
this.targetY = Math.random() * (canvas.height * 0.45) + (canvas.height * 0.1);
this.speed = Math.random() * 1.2 + 1.2;
this.particles = [];
this.exploded = false;

const colorPalettes = [
'#ff3385', '#ff4d94', '#ff80b3', '#ff1a75', '#ff99bb', '#ffffff', '#ffb3d1'
];
this.color = colorPalettes[Math.floor(Math.random() * colorPalettes.length)];
}

update() {
if (!this.exploded) {
this.y -= this.speed;
if (this.y <= this.targetY) {
this.exploded = true;
for (let i = 0; i < 70; i++) {
const theta = Math.random() * Math.PI * 2;
const phi = Math.acos((Math.random() * 2) - 1);
const speed = Math.random() * 2.2 + 0.6;
this.particles.push({
x: this.x,
y: this.y,
vx: Math.sin(phi) * Math.cos(theta) * speed,
vy: Math.sin(phi) * Math.sin(theta) * speed,
vz: Math.cos(phi) * speed,
alpha: 1,
decay: Math.random() * 0.008 + 0.006,
color: Math.random() > 0.3 ? this.color : '#ffffff'
});
}
}
} else {
this.particles.forEach(p => {
p.x += p.vx;
p.y += p.vy;
p.vy += 0.025;
p.alpha -= p.decay;
});
this.particles = this.particles.filter(p => p.alpha > 0);
}
}

draw() {
if (!this.exploded) {
ctx.save();
ctx.fillStyle = this.color;
ctx.shadowBlur = 10;
ctx.shadowColor = this.color;
ctx.beginPath();
ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
ctx.fill();
ctx.restore();
} else {
this.particles.forEach(p => {
let scale3d = (p.vz + 4) / 4;
if (scale3d < 0.2) scale3d = 0.2;

ctx.save();
ctx.globalAlpha = p.alpha;
ctx.fillStyle = p.color;
ctx.shadowBlur = 10;
ctx.shadowColor = p.color;
ctx.beginPath();
ctx.arc(p.x, p.y, 2.2 * scale3d, 0, Math.PI * 2);
ctx.fill();
ctx.restore();
});
}
}
}

// Emoji Bubu & Dudu wandering characters
let bubu = {
x: canvas.width * 0.25,
y: canvas.height * 0.75,
vx: 0.6,
vy: 0.35,
scaleZ: 1,
zAngle: 0
};

let dudu = {
x: canvas.width * 0.75,
y: canvas.height * 0.75,
vx: -0.5,
vy: -0.4,
scaleZ: 1,
zAngle: 0
};

function updateBubuDudu() {
bubu.x += bubu.vx;
bubu.y += bubu.vy;
bubu.zAngle += 0.025;
bubu.scaleZ = 1 + Math.sin(bubu.zAngle) * 0.12;

if (bubu.x < 40 || bubu.x > canvas.width - 40) bubu.vx *= -1;
if (bubu.y < 70 || bubu.y > canvas.height - 70) bubu.vy *= -1;

dudu.x += dudu.vx;
dudu.y += dudu.vy;
dudu.zAngle += 0.035;
dudu.scaleZ = 1 + Math.cos(dudu.zAngle) * 0.12;

if (dudu.x < 40 || dudu.x > canvas.width - 40) dudu.vx *= -1;
if (dudu.y < 70 || dudu.y > canvas.height - 70) dudu.vy *= -1;
}

function drawEmojiCharacter(char, emoji, name) {
ctx.save();
ctx.translate(char.x, char.y);
ctx.scale(char.scaleZ, char.scaleZ);

ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
ctx.beginPath();
ctx.ellipse(0, 22, 18, 7, 0, 0, Math.PI * 2);
ctx.fill();

ctx.font = '34px sans-serif';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.shadowBlur = 12;
ctx.shadowColor = '#ff4d88';
ctx.fillText(emoji, 0, 0);

ctx.shadowBlur = 5;
ctx.shadowColor = '#ff1a75';
ctx.fillStyle = '#ffb3c6';
ctx.font = 'bold 10px Courier New';
ctx.fillText(name, 0, -24);

ctx.restore();
}

function animateBackground() {
if (currentMode === 'matrix') {
matrixCounter++;
if (matrixCounter % 2 === 0) {
ctx.fillStyle = 'rgba(2, 0, 5, 0.15)';
ctx.fillRect(0, 0, canvas.width, canvas.height);

ctx.fillStyle = '#ff4d88';
ctx.font = fontSize + 'px monospace';

for (let i = 0; i < drops.length; i++) {
const text = characters.charAt(Math.floor(Math.random() * characters.length));
ctx.fillText(text, i * fontSize, drops[i] * fontSize);

if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
drops[i] = 0;
}
drops[i]++;
}
}
} else if (currentMode === 'galaxy') {
ctx.fillStyle = 'rgba(2, 0, 5, 0.22)';
ctx.fillRect(0, 0, canvas.width, canvas.height);

const centerX = canvas.width / 2;
const centerY = canvas.height / 2;

spaceStars.forEach(star => {
star.alpha += (Math.random() - 0.5) * 0.06;
if (star.alpha < 0.1) star.alpha = 0.1;
if (star.alpha > 1) star.alpha = 1;

ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
ctx.beginPath();
ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
ctx.fill();
});

if (Math.random() < 0.025) {
fireworks.push(new Firework3D());
}
fireworks.forEach((fw, index) => {
fw.update();
fw.draw();
if (fw.exploded && fw.particles.length === 0) {
fireworks.splice(index, 1);
}
});

const sunGlow = ctx.createRadialGradient(centerX, centerY, 5, centerX, centerY, 60);
sunGlow.addColorStop(0, '#ffffff');
sunGlow.addColorStop(0.3, '#ffcc00');
sunGlow.addColorStop(0.7, '#ff3300');
sunGlow.addColorStop(1, 'transparent');

ctx.fillStyle = sunGlow;
ctx.beginPath();
ctx.arc(centerX, centerY, 50, 0, Math.PI * 2);
ctx.fill();

orbits.forEach(orbit => {
ctx.strokeStyle = 'rgba(255, 179, 198, 0.15)';
ctx.lineWidth = 1;
ctx.beginPath();
ctx.ellipse(centerX, centerY, orbit.rx, orbit.ry, 0, 0, Math.PI * 2);
ctx.stroke();

orbit.angle += orbit.speed;
const px = centerX + Math.cos(orbit.angle) * orbit.rx;
const py = centerY + Math.sin(orbit.angle) * orbit.ry;

ctx.shadowBlur = 10;
ctx.shadowColor = orbit.color;
ctx.fillStyle = orbit.color;
ctx.beginPath();
ctx.arc(px, py, orbit.size, 0, Math.PI * 2);
ctx.fill();

if (orbit.hasRing) {
ctx.strokeStyle = 'rgba(191, 128, 255, 0.7)';
ctx.lineWidth = 2;
ctx.beginPath();
ctx.ellipse(px, py, orbit.size * 2.2, orbit.size * 0.8, Math.PI / 4, 0, Math.PI * 2);
ctx.stroke();
}
ctx.shadowBlur = 0;
});

updateBubuDudu();
drawEmojiCharacter(bubu, "🐼", "BUBU");
drawEmojiCharacter(dudu, "🐻", "DUDU");
}

requestAnimationFrame(animateBackground);
}

animateBackground();

window.addEventListener('resize', () => {
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
});

function showScreen(screenId) {
document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
document.getElementById(screenId).classList.add('active');
}

const photoWishes = [
"🌸 Wishing you a day filled with endless smiles, bright sunshine, and pure happiness! Have an amazing birthday! 💖",
"🌟 May this new year of your life bring marvelous achievements, good health, and success in everything you do! 🎉",
"🎂 Cheers to another wonderful year of making beautiful memories together. Stay as awesome as you are! 🥂✨",
"🎁 May all your secret dreams and deepest wishes come true today and throughout the coming year! 💫🎈",
"💖 Sending you the biggest hugs, sweetest kisses, and all the love in the universe on your special day! 🌸🥰"
];

function startIntro() {
showScreen('screen-3');
setTimeout(() => showScreen('screen-2'), 1000);
setTimeout(() => showScreen('screen-1'), 2000);
setTimeout(() => showScreen('screen-happy'), 3000);
setTimeout(() => showScreen('screen-bday'), 4200);
setTimeout(() => showScreen('screen-toyou'), 5400);

setTimeout(() => {
currentMode = 'galaxy';
showScreen('screen-bouquet');

setTimeout(() => { document.querySelector('.p1').classList.add('show'); updateWish(0); }, 500);
setTimeout(() => { document.querySelector('.p2').classList.add('show'); updateWish(1); }, 1200);
setTimeout(() => { document.querySelector('.p3').classList.add('show'); updateWish(2); }, 1900);
setTimeout(() => { document.querySelector('.p4').classList.add('show'); updateWish(3); }, 2600);
setTimeout(() => { document.querySelector('.p5').classList.add('show'); updateWish(4); finalizeWishes(); }, 3300);
}, 6600);
}

function updateWish(index) {
document.getElementById('main-wish-box').innerHTML = photoWishes[index];
}

function finalizeWishes() {
setTimeout(() => {
document.getElementById('main-wish-box').innerHTML = "✨ Tap any photo above to view it in a stunning frame with its special wish! 🌸💖";
}, 1500);
}

function openLightbox(index) {
const photoItems = document.querySelectorAll('.photo-item');
const img = photoItems[index].querySelector('img');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
const lightboxWish = document.getElementById('lightbox-wish');

if (img) {
lightboxImg.src = img.src;
lightboxWish.innerHTML = photoWishes[index];
lightbox.style.display = 'flex';
}
}

function closeLightbox() {
document.getElementById('lightbox').style.display = 'none';
}
</script>
</body>
</html>
